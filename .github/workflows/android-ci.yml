name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon --stacktrace --console=plain :finance-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-verification-reports
          path: |
            finance-engine/build/reports/tests/
            finance-engine/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK after successful checks
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
