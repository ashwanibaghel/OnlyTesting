name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon --stacktrace --console=plain :finance-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check committed Room schema matches compiler output
        run: |
          if [[ -n "$(git status --porcelain -- app/schemas)" ]]; then
            echo 'Room schema changed. Commit generated schemas and review the database version and migration.'
            git diff -- app/schemas
            exit 1
          fi
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fintrack-verification-reports
          path: |
            finance-engine/build/reports/tests/
            finance-engine/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fintrack-room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK after successful checks
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fintrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
